<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080A"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="glow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#D4FF00" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#D4FF00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- Subtle Inner Border -->
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#222226" stroke-width="3"/>

  <!-- Grid Crosshairs -->
  <line x1="256" y1="48" x2="256" y2="72" stroke="#444444" stroke-width="2"/>
  <line x1="256" y1="440" x2="256" y2="464" stroke="#444444" stroke-width="2"/>
  <line x1="48" y1="256" x2="72" y2="256" stroke="#444444" stroke-width="2"/>
  <line x1="440" y1="256" x2="464" y2="256" stroke="#444444" stroke-width="2"/>

  <!-- Huge Cropped Numeral '4' (The Hero Number) -->
  <text x="210" y="410" font-family="'Fira Code', monospace, sans-serif" font-weight="900" font-size="430" fill="#FFFFFF" text-anchor="middle" letter-spacing="-20">4</text>

  <!-- Electric Accent Dot / Telemetry Pulse -->
  <circle cx="390" cy="130" r="24" fill="#D4FF00"/>
  <circle cx="390" cy="130" r="38" fill="none" stroke="#D4FF00" stroke-width="2" stroke-opacity="0.5"/>

  <!-- MTX Minimalist Baseline -->
  <rect x="70" y="440" width="372" height="4" fill="#D4FF00"/>
</svg>
